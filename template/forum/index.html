{{ define "content" }}
<div class="layout">
	<div class="layout-main">
		{{ range $section := .Sections }}
		<div class="data-table cols-forum">
			<div class="data-row data-header">
				<div class="data-cell">
					<h1>{{ $section.Name }}</h1>
				</div>
				<div class="data-cell">
					<h1>Threads</h1>
				</div>
				<div class="data-cell">
					<h1>Posts</h1>
				</div>
				<div class="data-cell">
					<h1>Last Post</h1>
				</div>
			</div>

			{{ range $forum := $section.Forums }}
			<div class="data-row">
				<div class="data-cell">
					<h1><a href="/forum/index/{{ $forum.Id }}">{{ $forum.Name }}</a></h1>
					<p class="description">No description available</p>
				</div>
				<div class="data-cell">
					<h2>0</h2>
				</div>
				<div class="data-cell">
					<h2>0</h2>
				</div>
				<div class="data-cell">
					<h2>Never</h2>
				</div>
			</div>
			{{ end }}
		</div>
		{{ end }}
	</div>
</div>
{{ end }}
