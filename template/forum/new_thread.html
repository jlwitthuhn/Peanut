{{ define "content" }}
<div class="layout">
	<div class="layout-main">
		<div class="breadcrumb-row">
			<p class="breadcrumb"><a href="/forum/section/{{ .SectionId }}">{{ .SectionName }}</a> &rsaquo; <a href="/forum/index/{{ .ForumId }}">{{ .ForumName }}</a> &rsaquo; New Thread</p>
		</div>
		<div class="panel compact">
			<div class="panel-header">
				<h1>New Thread</h1>
			</div>
			<div class="panel-body">
				<form class="standard-form" action="/forum/new_thread/{{ .ForumId }}" method="post">
					<label for="input_title">Title:</label>
					<input type="text" id="input_title" name="title">
					<label for="input_message">Message:</label>
					<textarea rows="8" id="input_message" name="message"></textarea>
					<input type="hidden" name="forum_id" value="{{ .ForumId }}">
					<input type="hidden" name="csrf" value="{{ .CsrfToken }}">
					<input class="primary-button" type="submit" value="Post Thread">
				</form>
			</div>
		</div>
	</div>
</div>
{{ end }}
